# Netlify configuration: a static single-page site plus one serverless function.
# Link previews use a fixed image (og.png), so there is no edge function here.

[build]
  publish = "."
  functions = "netlify/functions"

# The image proxy must never be cached by the CDN as HTML.
[[headers]]
  for = "/.netlify/functions/dog-image"
  [headers.values]
    cache-control = "public, max-age=86400"
    x-content-type-options = "nosniff"

[[headers]]
  for = "/og.png"
  [headers.values]
    cache-control = "public, max-age=604800"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    cache-control = "public, max-age=604800"

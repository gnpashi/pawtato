<style>
  :root {
    --cream: #fdf6ec;
    --cream-deep: #f6e7d3;
    --ink: #241a13;
    --ink-soft: #6b5546;
    --bark: #b4643c;
    --sun: #ffcf6b;
    --shadow: 0 24px 60px -24px rgba(87, 50, 28, 0.45);
    --radius: 34px;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  html { overflow-x: hidden; }

  body {
    margin: 0;
    padding: clamp(16px, 4vw, 40px);
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #fff4df 0%, rgba(255, 244, 223, 0) 60%),
      radial-gradient(900px 500px at 110% 110%, #ffe6d2 0%, rgba(255, 230, 210, 0) 55%),
      var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* Soft paw-print field: pure CSS, no assets. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 12% 22%, var(--cream-deep) 0 7px, transparent 8px),
      radial-gradient(circle at 18% 16%, var(--cream-deep) 0 5px, transparent 6px),
      radial-gradient(circle at 6% 15%, var(--cream-deep) 0 5px, transparent 6px),
      radial-gradient(circle at 82% 74%, var(--cream-deep) 0 7px, transparent 8px),
      radial-gradient(circle at 88% 68%, var(--cream-deep) 0 5px, transparent 6px),
      radial-gradient(circle at 76% 67%, var(--cream-deep) 0 5px, transparent 6px);
    background-size: 360px 360px;
    background-repeat: repeat;
  }

  .app {
    position: relative;
    width: min(560px, 100%);
    min-width: 0;
    max-width: 100%;
    overflow-x: clip;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.2vw, 20px);
  }

  .masthead {
    display: flex;
    min-width: 0;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-inline: 6px;
  }

  .brand {
    min-width: 0;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: clamp(30px, 7vw, 42px);
    height: clamp(30px, 7vw, 42px);
    flex: none;
    color: var(--bark);
    transform: rotate(-8deg);
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(28px, 6.6vw, 46px);
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-weight: 850;
  }

  .brand h1 span { color: var(--bark); }

  .brand p {
    margin: 6px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .counter {
    flex: none;
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-bottom: 4px;
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 100%;
    border-radius: var(--radius);
    background: var(--cream-deep);
    box-shadow: var(--shadow);
    overflow: hidden;
    height: clamp(280px, 54vh, 540px);
    isolation: isolate;
    cursor: default;
  }

  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(36, 26, 19, 0.08), inset 0 -60px 80px -60px rgba(36, 26, 19, 0.45);
    pointer-events: none;
    z-index: 1;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    max-width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.04);
    transition: opacity 520ms ease, transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
    background: var(--cream-deep);
  }

  .photo.is-visible { opacity: 1; transform: scale(1); }

  /* Skeleton while the first bytes arrive. */
  .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, #f2e2cd 20%, #fbf0e0 38%, #f2e2cd 56%);
    background-size: 250% 100%;
    animation: shimmer 1.35s linear infinite;
    display: grid;
    place-items: center;
  }

  .skeleton[hidden] { display: none; }

  @keyframes shimmer {
    from { background-position: 130% 0; }
    to { background-position: -30% 0; }
  }

  .skeleton .paw {
    font-size: clamp(38px, 9vw, 60px);
    filter: saturate(0.35);
    opacity: 0.5;
    animation: bob 1.6s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-9px) rotate(6deg); }
  }

  /* The name shares the breed's pill: name, a dot, then the breed. */
  .chip-name {
    font-weight: 800;
    color: var(--ink);
  }

  .chip-name:empty { display: none; }

  .chip-dot {
    width: 3px;
    height: 3px;
    flex: none;
    margin: 0 7px;
    border-radius: 50%;
    background: rgba(36, 26, 19, 0.35);
  }

  .chip-dot[hidden] { display: none; }


  .chip {
    position: absolute;
    left: 16px;
    bottom: 16px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0;
    height: 36px;
    max-width: calc(100% - 124px);
    padding: 0 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 750;
    color: var(--ink);
    background: rgba(255, 250, 242, 0.92);
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 16px -8px rgba(36, 26, 19, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 300ms ease, transform 300ms ease;
  }

  .chip.is-visible { opacity: 1; transform: translateY(0); }

  .save {
    position: absolute;
    top: auto;
    bottom: 16px;
    right: 16px;
    z-index: 2;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    background: rgba(255, 250, 242, 0.92);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px -10px rgba(36, 26, 19, 0.6);
    transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), background 200ms ease;
  }

  .share {
    position: absolute;
    top: auto;
    bottom: 16px;
    right: 60px;
    z-index: 2;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    background: rgba(255, 250, 242, 0.92);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px -10px rgba(36, 26, 19, 0.6);
    transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), background 200ms ease;
  }

  .share:hover { transform: scale(1.09); background: #fff; }
  .share:active { transform: scale(0.94); }

  .save:hover { transform: scale(1.09); }
  .save:active { transform: scale(0.94); }
  .save[aria-pressed="true"] {
    background: #fff;
    box-shadow: 0 8px 20px -10px rgba(213, 63, 63, 0.75), inset 0 0 0 2px rgba(213, 63, 63, 0.28);
  }

  .controls { display: grid; gap: 12px; }

  .fetch {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 24px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--cream);
    background: linear-gradient(180deg, #3a2a1f 0%, var(--ink) 100%);
    box-shadow: 0 16px 30px -16px rgba(36, 26, 19, 0.85);
    cursor: pointer;
    transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 220ms ease, opacity 200ms ease;
  }

  .fetch:hover { transform: translateY(-2px); box-shadow: 0 22px 38px -18px rgba(36, 26, 19, 0.9); }
  .fetch:active { transform: translateY(1px) scale(0.99); }
  .fetch:disabled { cursor: progress; opacity: 0.72; transform: none; }
  .fetch .dot { font-size: 18px; }
  .fetch.is-loading .dot { animation: spin 1.1s linear infinite; display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .sr-live {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .credits { margin-top: 2px; text-align: center; }
  .credits p { margin: 0; font-size: 11.5px; color: rgba(107, 85, 70, 0.8); }
  .credits a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    padding: 12px;
    background: rgba(14, 10, 7, 0.94);
    animation: fadeIn 180ms ease-out;
  }

  .lightbox[hidden] { display: none; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }


  .lightbox img {
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
  }

  .lightbox-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    color: var(--cream);
    background: rgba(255, 255, 255, 0.16);
  }

  .lightbox-close:hover { background: rgba(255, 255, 255, 0.26); }
  body.is-locked { overflow: hidden; }

  /* Emoji glyphs, forced to a single ink colour. The loved heart is the one accent. */
  .emoji {
    display: inline-block;
    font-size: 1em;
    line-height: 1;
    filter: grayscale(1) brightness(0.42) contrast(1.15);
    transition: filter 180ms ease, transform 180ms ease;
  }

  .icon-heart { width: 19px; height: 19px; }

  /* On the photo the heart is white; the pill behind it is dark so it always reads. */
  .save, .share {
    color: #ffffff;
    background: rgba(18, 13, 9, 0.42);
    box-shadow: 0 8px 20px -12px rgba(0, 0, 0, 0.8);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .save:hover, .share:hover { background: rgba(18, 13, 9, 0.56); }

  .save.is-loved { color: #ec3b3b; background: rgba(255, 255, 255, 0.94); }

  .heart-red { color: #ec3b3b; }

  .recent .thumb-heart .icon { width: 12px; height: 12px; }

  .share.is-busy { cursor: progress; }

  .share.is-busy .share-glyph { visibility: hidden; }

  .share.is-busy::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    animation: spin 800ms linear infinite;
  }

  .share-glyph {
    width: 17px;
    height: 17px;
    fill: currentColor;
    stroke: currentColor;
    color: #ffffff;
  }
  .recent .thumb-heart { color: #ec3b3b; }
  .chip .icon { width: 13px; height: 13px; opacity: 0.75; }
  .fetch.is-loading { letter-spacing: 0.01em; }
  .skeleton .paw { font-size: 52px; }

  .error {
    display: none;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-radius: 18px;
    background: #fff1e8;
    box-shadow: inset 0 0 0 1px #f0cdb6;
    font-size: 13.5px;
    color: #7d3d1b;
  }

  .error[data-show="true"] { display: flex; }

  .error button {
    flex: none;
    border: 0;
    border-radius: 999px;
    padding: 9px 15px;
    font: inherit;
    font-weight: 750;
    color: #fff;
    background: var(--bark);
    cursor: pointer;
  }

  .recent {
    display: block;
    padding-inline: 4px;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }

  .recent[hidden] { display: none; }

  .recent p {
    margin: 0;
    padding-inline: 2px;
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .recent ul {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    min-width: 0;
    max-width: 100%;
  }

  .recent ul::-webkit-scrollbar { display: none; }

  .recent li { flex: none; }

  .recent button {
    width: 46px;
    height: 46px;
    padding: 0;
    border: 0;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: var(--cream-deep);
    box-shadow: 0 6px 14px -10px rgba(36, 26, 19, 0.7);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }

  .recent button:hover { transform: translateY(-3px); box-shadow: 0 12px 18px -12px rgba(36, 26, 19, 0.8); }
  .recent img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Double tap on the photo: a small puff of hearts from the tap point. */
  .heart-burst {
    position: absolute;
    z-index: 4;
    width: 15px;
    height: 15px;
    color: #ec3b3b;
    pointer-events: none;
    user-select: none;
    will-change: transform, opacity;
    animation: heartFloat 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .heart-burst.puff {
    width: 27px;
    height: 27px;
    animation: heartPuff 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes heartFloat {
    0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% - 74px)) scale(1.04) rotate(var(--rot)); opacity: 0; }
  }

  @keyframes heartPuff {

  .boop {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    pointer-events: none;
    animation: boop 620ms ease-out forwards;
  }

  @keyframes boop {
    from { transform: scale(0.4); opacity: 0.9; }
    to { transform: scale(6); opacity: 0; }
  }

  .controls-secondary { gap: 0; }

  .ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 20px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 750;
    color: var(--ink-soft);
    background: rgba(255, 250, 242, 0.75);
    box-shadow: inset 0 0 0 1.5px rgba(36, 26, 19, 0.12);
    cursor: pointer;
    transition: transform 180ms ease, background 200ms ease, color 200ms ease;
  }

  .ghost:hover { background: #fff; transform: translateY(-1px); color: var(--ink); }
  .ghost[aria-expanded="true"] { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(180, 100, 60, 0.5); }

  .ghost .count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    background: var(--sun);
  }

  .loved {
    padding: 12px;
    border-radius: 24px;
    background: rgba(255, 250, 242, 0.85);
    box-shadow: inset 0 0 0 1px rgba(36, 26, 19, 0.08);
  }

  .loved[hidden] { display: none; }

  .loved ul {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .loved li {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .loved .loved-empty {
    grid-column: 1 / -1;
    margin: 0;
    padding: 4px;
    font-size: 13px;
    color: var(--ink-soft);
    list-style: none;
  }

  .name-input {
    width: 100%;
    min-width: 0;
    padding: 7px 9px;
    border: 1px solid rgba(36, 26, 19, 0.14);
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 650;
    color: var(--ink);
    background: #fff;
    text-align: center;
  }

  .name-input::placeholder { color: rgba(107, 85, 70, 0.6); font-weight: 500; }
  .name-input:focus { outline: 2px solid rgba(180, 100, 60, 0.55); outline-offset: 1px; }

  .loved .thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 0;
    border: 0;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    background: var(--cream-deep);
    box-shadow: 0 8px 16px -12px rgba(36, 26, 19, 0.8);
    transition: transform 200ms ease;
  }

  .loved .thumb:hover { transform: translateY(-2px); }
  .loved img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .loved .empty {
    margin: 0;
    padding: 6px 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .loved .unlove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    background: rgba(255, 250, 242, 0.92);
    box-shadow: 0 4px 10px -6px rgba(36, 26, 19, 0.8);
  }

  .recent .thumb { position: relative; }

  .recent .thumb-heart {
    position: absolute;
    right: 1px;
    bottom: 1px;
    font-size: 11px;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.9));
  }

  .recent .thumb-heart[hidden] { display: none; }

  :focus-visible { outline: 3px solid var(--bark); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }

  var busy = false;

  var sharedView = null;

  // A few API slugs are squashed together; the API has no spaced form to fall back on.
  var SLUG_ALIASES = {
    shihtzu: ["Shih", "Tzu"],
    stbernard: ["St.", "Bernard"],
    mexicanhairless: ["Mexican", "Hairless"],
    chinescrest: ["Chinese", "Crested"]
  };

  function readSeen() {
    try {
      var value = parseInt(window.localStorage.getItem(SEEN_KEY) || "0", 10);
      return isFinite(value) && value > 0 ? value : 0;
    } catch (error) {
      return 0;
    }
  }

  function writeSeen() {
    try {
      window.localStorage.setItem(SEEN_KEY, String(seen));
    } catch (error) {
      /* the counter simply restarts next time */
    }
  }

  function renderCounter() {
    counterEl.textContent = seen === 1 ? "1 dog" : seen + " dogs";
  }

  /* A loved dog is { url, name }. Entries written by the older build were bare URLs. */
  function readSaved() {
    try {
      var raw = window.localStorage.getItem(FAV_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(parsed)) return [];
      return parsed.map(function (entry) {
        if (typeof entry === "string") return { url: entry, name: "" };
        if (entry && typeof entry.url === "string") {
          return { url: entry.url, name: typeof entry.name === "string" ? entry.name : "" };
        }
        return null;
      }).filter(Boolean);
    } catch (error) {
      return [];
    }
  }

  function lovedIndex(url) {
    for (var i = 0; i < saved.length; i += 1) {
      if (saved[i].url === url) return i;
    }
    return -1;
  }

  function isLoved(url) {
    return url ? lovedIndex(url) !== -1 : false;
  }

  function writeSaved() {
    try {
      window.localStorage.setItem(FAV_KEY, JSON.stringify(saved.slice(-40)));
    } catch (error) {
      /* storage may be unavailable; the heart still works for this session */
    }
  }

  function readRecent() {
    try {
      var raw = window.localStorage.getItem(RECENT_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter(function (url) { return typeof url === "string"; }).slice(-RECENT_LIMIT) : [];
    } catch (error) {
      return [];
    }
  }

  function writeRecent() {
    try {
      window.localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
    } catch (error) {
      /* same as above: recent simply will not survive a reload */
    }
  }

  /* A dog appears in Recent once: coming back to it moves it to the front, never duplicates it. */
  function remember(url) {
    var index = recent.indexOf(url);
    if (index !== -1) recent.splice(index, 1);
    recent.push(url);
    if (recent.length > RECENT_LIMIT) recent.shift();
    writeRecent();
    paintRecent();
  }

  function titleCase(word) {
    return word.charAt(0).toUpperCase() + word.slice(1);
  }

  /* "bulldog-french" is how the API writes "French Bulldog": the sub-breed comes first. */
  function breedFromUrl(url) {
    var match = /\/breeds\/([^/]+)\//.exec(url || "");
    if (!match) return "Good dog";
    var parts = decodeURIComponent(match[1]).split("-").filter(Boolean);
    if (!parts.length) return "Good dog";
    var head = SLUG_ALIASES[parts[0]] || [titleCase(parts[0])];
    if (parts.length > 1) {
      return titleCase(parts[1]) + " " + head.join(" ");
    }
    return head.join(" ");
  }

  /* The name the human gave this dog, over the photo, top centre. */
  function syncNameBadge(url) {

  function burstHearts(clientX, clientY) {
    var box = frame.getBoundingClientRect();
    var x = clientX - box.left;
    var y = clientY - box.top;

    var puff = document.createElement("span");
    puff.className = "heart-burst puff icon icon-heart";
    puff.style.left = x + "px";
    puff.style.top = y + "px";
    frame.appendChild(puff);
    window.setTimeout(function () { puff.remove(); }, 640);

    for (var i = 0; i < 6; i += 1) {
      var heart = document.createElement("span");
      heart.className = "heart-burst icon icon-heart";
      heart.style.left = x + "px";
      heart.style.top = y + "px";
      heart.style.setProperty("--dx", (Math.random() * 56 - 28).toFixed(0) + "px");
      heart.style.setProperty("--rot", (Math.random() * 40 - 20).toFixed(0) + "deg");
      heart.style.animationDelay = (i * 45) + "ms";
      frame.appendChild(heart);
      (function (node) {
        window.setTimeout(function () { node.remove(); }, 1000 + i * 45);
      })(heart);
    }
  }

  function pulseHeartButton() {

  function paintRecent() {
    if (!recent.length) {
      recentEl.hidden = true;
      recentList.textContent = "";

    recentEl.hidden = false;
    recentList.textContent = "";
    recent.slice().reverse().forEach(function (url) {

  function renderLoved() {

  function toggleLove(url) {
    if (!url) return;
    var index = lovedIndex(url);
    if (index === -1) {
      saved.push({ url: url, name: "" });
      setStatus("Saved. Give it a name below.");
    } else {
      saved.splice(index, 1);
      setStatus("Removed from loved dogs.");

    writeSaved();
    syncHeart();
    paintRecent();
    renderLoved();
    if (lovedPanel.hidden) setLovedOpen(true);

  function renameLoved(url, name) {
    var index = lovedIndex(url);
    if (index === -1) return;
    saved[index].name = name;
    writeSaved();

    }

  function syncHeart() {
    var loved = isLoved(currentUrl);
    saveBtn.setAttribute("aria-pressed", loved ? "true" : "false");
    saveBtn.classList.toggle("is-loved", loved);
    /* White heart while unsaved, red once it is loved: the colour lives in CSS. */
    saveBtn.setAttribute("aria-label", loved ? "Remove from loved dogs" : "Love this dog");
    saveBtn.title = loved ? "Remove from loved dogs" : "Love this dog";
  }

  function paint(url, options) {
    options = options || {};
    currentUrl = url;
    photo.classList.remove("is-visible");
    skeleton.hidden = true;

    var revealed = false;

    function reveal() {
      if (revealed) return;
      revealed = true;
      photo.classList.add("is-visible");
      breedEl.textContent = displayBreed(url);
      chip.classList.add("is-visible");
      if (options.countSeen !== false) {
        seen += 1;
        writeSeen();
        renderCounter();
      }
      syncHeart();
      syncNameBadge(url);
      rememberShareUrl(url);
      prepareShare(url);
    }

    photo.onload = reveal;

    photo.onerror = function () {
      photo.classList.remove("is-visible");
      skeleton.hidden = false;
      // Even when the picture is gone, say which dog this is.
      breedEl.textContent = displayBreed(url);
      syncNameBadge(url);
      showError("That photo would not load. The kennel might be busy.");
    };

    // Asking for the same dog twice must not wait for a second load event: the browser
    // fires none when src is unchanged, which would leave the frame blank.
    if (photo.src === url && photo.complete && photo.naturalWidth > 0) {
      reveal();
    } else {
      photo.alt = "A random " + displayBreed(url).toLowerCase() + " dog";
      photo.src = url;
    }

    remember(url);
  }

  function failure(message) {
    skeleton.hidden = false;
    photo.classList.remove("is-visible");
    showError(message);
    setStatus("");
  }

  function fetchDog() {
    if (busy || sharing) return;
    busy = true;
    clearError();
    setLoading(true);
    boopRipple();

    var controller = window.AbortController ? new AbortController() : null;
    var timer = window.setTimeout(function () {
      if (controller) controller.abort();
    }, 12000);

    fetch(API, controller ? { signal: controller.signal } : undefined)
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        if (!data || data.status !== "success" || !data.message) {
          throw new Error("Unexpected payload");
        }
        paint(data.message);
      })
      .catch(function (error) {
        failure(error && error.name === "AbortError"
          ? "The request timed out. The internet is being shy."
          : "Could not reach the dog kennel. Check your connection.");
      })
      .then(function () {
        window.clearTimeout(timer);
        busy = false;
        setLoading(false);
      });
  }

  var lightbox = document.getElementById("lightbox");

  var lightboxClose = document.getElementById("lightbox-close");

  function closeLightbox() {

  document.addEventListener("keydown", function (event) {

  function nameFor(url) {
    var index = lovedIndex(url);
    return index === -1 ? "" : (saved[index].name || "").trim();
  }

  /* A shared link carries its own name and breed; otherwise use the local ones. */
  function displayName(url) {
    var mine = nameFor(url);
    if (mine) return mine;
    if (sharedView && sharedView.dog === url && sharedView.name) return sharedView.name;
    return generatedName(url);
  }

  function displayBreed(url) {
    if (sharedView && sharedView.dog === url && sharedView.breed) return sharedView.breed;
    return breedFromUrl(url);
  }

  function generatedName(url) {
    var hash = 0;
    var text = String(url || "");
    for (var i = 0; i < text.length; i += 1) {
      hash = (hash * 31 + text.charCodeAt(i)) % 1000003;
    }
    return DOG_NAMES[hash % DOG_NAMES.length];
  }

  function dogName(url) {
    return displayName(url) || generatedName(url);
  }

  var SITE = "https://pawtato.netlify.app";
  /* Netlify Function that streams the photo, so this page can hand a real File to the
     Web Share API without fighting CORS or the CDN. */
  var SHARE_ENDPOINT = "/.netlify/functions/dog-image?url=";
  var SHARE_TYPES = ["image/jpeg", "image/png", "image/webp"];
  var sharing = false;
  /* The shareable address of this dog: the photo, its name and its breed, so the person who
     opens it lands on exactly the same dog. */
  function createShareUrl(url) {
    var image = url || currentUrl;
    var base;
    try {
      base = new URL(window.location.origin + window.location.pathname);
    } catch (error) {
      base = new URL(SITE + "/");
    }
    if (base.protocol !== "http:" && base.protocol !== "https:") {
      base = new URL(SITE + "/");
    }
    base.searchParams.set("dog", image);
    base.searchParams.set("name", dogName(image));
    base.searchParams.set("breed", displayBreed(image));
    return base.toString();
  }

  /* Keeps the address bar pointing at the dog on screen, so copying it by hand works too. */
  function rememberShareUrl(url) {
    if (!window.history || !window.history.replaceState) return;
    try {
      window.history.replaceState(null, "", createShareUrl(url));
    } catch (error) {
      /* file:// and locked-down contexts simply keep the old address */
    }
  }

  function getSharedDog() {
    var params;
    try {
      params = new URLSearchParams(window.location.search);
    } catch (error) {
      return null;
    }
    var dog = params.get("dog");
    var name = params.get("name");
    var breed = params.get("breed");
    if (!dog || !name || !breed) return null;

    try {
      var imageUrl = new URL(dog);
      if (imageUrl.protocol !== "https:" || imageUrl.hostname !== "images.dog.ceo") return null;
      return { dog: dog, name: String(name).slice(0, 24), breed: String(breed).slice(0, 40) };
    } catch (error) {
      return null;
    }
  }

  function shareText(url) {
    var image = url || currentUrl;
    return "Meet " + dogName(image) + "\n" +
      "The " + displayBreed(image) + "\n" +
      createShareUrl(image);
  }

  function copyLink(text) {
    // shareText() already ends with the link; never paste it twice.
    var line = text;

    function done() {
      setStatus("Link copied!");
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(line).then(done).catch(function () { legacyCopy(line); });
      return;
    }
    legacyCopy(line);
  }

  function legacyCopy(line) {
    try {
      var area = document.createElement("textarea");
      area.value = line;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      var ok = document.execCommand("copy");
      area.remove();
      if (ok) {
        setStatus("Link copied!");
        return;
      }
    } catch (error) {
      /* fall through to the prompt */
    }
    window.prompt("Copy this link:", createShareUrl(currentUrl));
  }

  /* The native share sheet, with the name, the breed and the link. If the platform has no
     sheet at all, the same message lands on the clipboard. */
  /* Share the actual photograph. The image is pulled through /.netlify/functions/dog-image,
     turned into a File and handed to the native sheet together with the name, the breed and
     the deep link. Any failure falls back to sharing the link - but a cancelled share sheet
     is the user saying no, so it never triggers anything else. */
  /* The photo for the dog on screen, fetched ahead of time.

     Android Chrome only allows navigator.share() while the tap's user activation is still
     alive, and it is easy to burn that on an await. So the File is prepared in the
     background: by the time the finger lands the sheet can be opened synchronously, with
     the image attached. */
  /* ------------------------------------------------------------------------------------
     Sharing, the careful way.

     Android only opens the share sheet while the tap's user activation is still alive, so
     the photo is fetched and turned into a File ahead of time: by the time a finger lands,
     navigator.share() can be called synchronously with the image attached. The button
     stays disabled until that File exists, and nothing ever calls navigator.share() twice
     from one tap - a second call is exactly what makes Chrome fall back to "copied".
     ------------------------------------------------------------------------------------ */

  var shareState = {
    url: "",
    file: null,
    status: "idle",   // idle | loading | ready | error
    reason: "",
    token: 0,
    http: 0,
    mime: "",
    bytes: 0
  };

  /* Sharing never shouts at the user. Anything worth knowing goes to the console. */
  function noteShare() {
    try {
      console.log.apply(console, ["[share]"].concat(Array.prototype.slice.call(arguments)));
    } catch (error) {
      /* no console, no noise */
    }
  }

  function shareFileName(url, mime) {
    var slug = dogName(url).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "dog";
    var extension = mime === "image/png" ? "png" : mime === "image/webp" ? "webp" : "jpg";
    return "pawtato-" + slug + "." + extension;
  }

  /* ------------------------------------------------------------------------------------
     The shared picture: the photo untouched, the name and breed in the site's own chip
     language near the bottom, and a polaroid footer carrying the wordmark. Everything is
     drawn into pixels, so the attachment looks right in every app.
     ------------------------------------------------------------------------------------ */

  var SHARE_MAX_WIDTH = 1400;
  var SHARE_FONT = 'ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file).catch(function () {
        return loadBitmapFallback(file);
      });
    }
    return loadBitmapFallback(file);
  }

  function loadBitmapFallback(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("Could not decode the photo"));
      };
      img.src = url;
    });
  }

  function roundedPath(ctx, x, y, w, hh, r) {
    var radius = Math.min(r, hh / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + hh, radius);
    ctx.arcTo(x + w, y + hh, x, y + hh, radius);
    ctx.arcTo(x, y + hh, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  /* Writes the wordmark: "paw" in ink, "tato" in the site's bark colour. */
  function drawWordmark(ctx, cx, cy, size) {
    var ink = "#241a13";
    var bark = "#b4643c";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = "850 " + size + "px " + SHARE_FONT;
    var letterSpacing = -(size * 0.045);
    if ("letterSpacing" in ctx) ctx.letterSpacing = letterSpacing.toFixed(1) + "px";

    var head = "paw";
    var tail = "tato";
    var headWidth = ctx.measureText(head).width;
    var tailWidth = ctx.measureText(tail).width;
    var startX = cx - (headWidth + tailWidth) / 2;

    ctx.fillStyle = ink;
    ctx.fillText(head, startX, cy);
    ctx.fillStyle = bark;
    ctx.fillText(tail, startX + headWidth, cy);

    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    return headWidth + tailWidth;
  }

  /* name • breed, in the same pill the page uses over the photo. */
  function drawChip(ctx, w, h, name, breed) {
    var margin = Math.round(w * 0.045);
    var padX = Math.round(w * 0.039);
    var pillH = Math.round(w * 0.10);
    var nameSize = Math.round(w * 0.0363);
    var breedSize = Math.round(nameSize * 0.94);
    var gap = Math.round(w * 0.018);
    var dotR = Math.max(2, Math.round(w * 0.0045));
    var maxText = w - margin * 2 - padX * 2;

    function measure(ns, bs) {
      ctx.font = "800 " + ns + "px " + SHARE_FONT;
      var nw = ctx.measureText(name).width;
      ctx.font = "600 " + bs + "px " + SHARE_FONT;
      var bw = ctx.measureText(breed).width;
      return { name: nw, breed: bw, total: nw + gap * 2 + dotR * 2 + bw };
    }

    var box = measure(nameSize, breedSize);
    // Long names and breeds shrink instead of spilling out of the picture.
    while (box.total > maxText && nameSize > w * 0.022) {
      nameSize = Math.max(Math.round(w * 0.022), Math.round(nameSize * 0.94));
      breedSize = Math.max(Math.round(w * 0.020), Math.round(breedSize * 0.94));
      box = measure(nameSize, breedSize);
    }

    var pillW = Math.min(maxText + padX * 2, Math.round(box.total + padX * 2));
    var x = margin;
    var y = h - margin - pillH;

    ctx.save();
    ctx.shadowColor = "rgba(36, 26, 19, 0.5)";
    ctx.shadowBlur = Math.round(w * 0.02);
    ctx.shadowOffsetY = Math.round(w * 0.006);
    ctx.fillStyle = "rgba(255, 250, 242, 0.92)";
    roundedPath(ctx, x, y, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.restore();

    var textY = y + pillH / 2;
    var cursor = x + padX;

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    // Clip so an extreme string can never escape the pill.
    ctx.save();
    roundedPath(ctx, x, y, pillW, pillH, pillH / 2);
    ctx.clip();

    ctx.fillStyle = "#241a13";
    ctx.font = "800 " + nameSize + "px " + SHARE_FONT;
    ctx.fillText(name, cursor, textY);
    cursor += box.name + gap;

    ctx.fillStyle = "rgba(36, 26, 19, 0.35)";
    ctx.beginPath();
    ctx.arc(cursor + dotR, textY, dotR, 0, Math.PI * 2);
    ctx.fill();
    cursor += dotR * 2 + gap;

    ctx.fillStyle = "rgba(36, 26, 19, 0.82)";
    ctx.font = "600 " + breedSize + "px " + SHARE_FONT;
    ctx.fillText(breed, cursor, textY);

    ctx.restore();
  }

  function decoratePhoto(file, url) {
    return loadBitmap(file).then(function (bitmap) {
      var sourceW = bitmap.width || bitmap.naturalWidth;
      var sourceH = bitmap.height || bitmap.naturalHeight;
      if (!sourceW || !sourceH) throw new Error("Photo has no size");

      var scale = Math.min(1, SHARE_MAX_WIDTH / sourceW);
      var w = Math.round(sourceW * scale);
      var h = Math.round(sourceH * scale);
      var markSize = Math.round(w * 0.072);
      // The footer is just the wordmark plus a little air above and below it.
      var footerH = Math.round(markSize * 1.85);

      var canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h + footerH;
      var ctx = canvas.getContext("2d");

      // Polaroid paper
      ctx.fillStyle = "#fffaf2";
      ctx.fillRect(0, 0, w, h + footerH);

      // The photo exactly as it is - no crop, no stretch.
      ctx.drawImage(bitmap, 0, 0, w, h);

      // A soft shade only where the chip sits, so white dogs stay readable.
      var gradient = ctx.createLinearGradient(0, h * 0.68, 0, h);
      gradient.addColorStop(0, "rgba(20, 14, 9, 0)");
      gradient.addColorStop(1, "rgba(20, 14, 9, 0.42)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, h * 0.68, w, h * 0.32);

      drawChip(ctx, w, h, dogName(url), displayBreed(url));
      drawWordmark(ctx, w / 2, h + footerH / 2, markSize);

      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (!blob) {
            reject(new Error("Could not encode the photo"));
            return;
          }
          resolve(new File([blob], shareFileName(url, "image/jpeg"), { type: "image/jpeg" }));
        }, "image/jpeg", 0.92);
      });
    });
  }

  /* Fetches the photo of this dog through the Netlify Function and keeps the File in memory.
     A stale response (the user moved on to another dog) is thrown away by the token. */
  function prepareShare(url) {
    if (!url) return;

    var token = shareState.token + 1;
    shareState.token = token;
    shareState.url = url;
    shareState.file = null;
    shareState.status = "loading";
    shareState.reason = "";
    shareState.http = 0;
    shareState.mime = "";
    shareState.bytes = 0;

    setShareBusy(true);
    noteShare("preparing", url);

    fetch(SHARE_ENDPOINT + encodeURIComponent(url), { credentials: "same-origin" })
      .then(function (response) {
        shareState.http = response.status;
        noteShare("response", response.status, response.headers.get("content-type"));
        if (!response.ok) throw new Error("Image download failed (HTTP " + response.status + ")");
        return response.blob();
      })
      .then(function (blob) {
        if (token !== shareState.token) {
          noteShare("stale response dropped");
          return;
        }
        var mime = (blob.type || "").split(";")[0].trim().toLowerCase();
        shareState.mime = mime;
        shareState.bytes = blob.size;
        noteShare("blob", mime, blob.size + " bytes");

        if (SHARE_TYPES.indexOf(mime) === -1) {
          throw new Error("Unsupported image type: " + (mime || "none"));
        }
        if (blob.size < 1024) throw new Error("Image looks empty (" + blob.size + " bytes)");

        var file = new File([blob], shareFileName(url, mime), { type: mime });
        noteShare("file created:", file.name, file.type, file.size + " bytes");
        return decoratePhoto(file, url).then(function (decorated) {
          return { plain: file, decorated: decorated };
        }).catch(function (error) {
          // If the drawing fails, the untouched photo is still perfectly shareable.
          noteShare("decoration failed, using the plain photo:", error && error.message);
          return { plain: file, decorated: file };
        });
      })
      .then(function (files) {
        if (token !== shareState.token) {
          noteShare("stale decoration dropped");
          return;
        }
        shareState.file = files.decorated;
        shareState.status = "ready";
        setShareBusy(false);
        shareBtn.disabled = false;
        noteShare("ready to share:", files.decorated.size, "bytes");
      })
      .catch(function (error) {
        if (token !== shareState.token) return;
        shareState.status = "error";
        shareState.reason = (error && error.message) ? error.message : String(error);
        // Quiet on screen: the button simply stays as it was, and the tap can try again.
        setShareBusy(false);
        shareBtn.disabled = false;
        noteShare("prepare failed:", shareState.reason);
      });
  }

  /* Everything below runs inside the tap, with no awaits before navigator.share(). */
  /* canShare() is a hint, and on several Android builds it answers false for a perfectly
     shareable image. Blocking on it means the image is never even tried, so the file share
     is always attempted; the link share only runs when the file share was refused *before*
     any sheet opened (TypeError / DataError), because in that case the tap's activation is
     still intact. After a real sheet has opened - cancel or success - nothing else is called. */
  /* No error popups: sharing either works or it stays quiet.

     The photo is always attempted first - canShare() is only a hint and answers false on
     browsers that share links but not files (Firefox, in-app webviews). If the file share is
     refused before any sheet appears, one link share follows inside the same tap. If the sheet
     was opened and cancelled, nothing else happens. */
  function shareDog(url) {
    if (!url || busy || sharing) return;

    if (shareState.url !== url || shareState.status === "idle") {
      prepareShare(url);
      return;
    }

    if (shareState.status === "loading") {
      noteShare("still preparing, tap again in a moment");
      return;
    }

    if (!shareState.file) {
      noteShare("no file to share:", shareState.reason || "unknown");
      return;
    }

    if (typeof navigator.share !== "function") {
      copyLink(shareText(url));
      return;
    }

    var file = shareState.file;
    var text = shareText(url);
    var title = dogName(url) + " \uD83D\uDC36";
    var link = createShareUrl(url);

    function shareLink(reason) {
      sharing = true;
      navigator.share({ title: title, text: text, url: link })
        .then(function () {
          sharing = false;
          noteShare("link share resolved");
        })
        .catch(function (error) {
          sharing = false;
          var name = (error && error.name) || "Error";
          noteShare("link share rejected:", name, error && error.message);
          if (name === "AbortError") return;
          copyLink(text);
        });
    }

    setShareBusy(false);
    sharing = true;
    noteShare("sharing the photo:", file.name, file.size + " bytes");

    navigator.share({ files: [file], title: title, text: text })
      .then(function () {
        sharing = false;
        shareState.status = "ready";
        noteShare("photo share resolved");
      })
      .catch(function (error) {
        sharing = false;
        var name = (error && error.name) || "Error";
        var message = (error && error.message) || String(error);
        noteShare("photo share rejected:", name, message);

        if (name === "AbortError") {
          // The sheet was open and the user closed it: that is the whole answer.
          shareState.status = "ready";
          return;
        }

        if (name === "TypeError" || name === "DataError" || name === "NotSupportedError") {
          // Refused before a sheet opened, so the gesture is still alive: send the link.
          shareLink(name);
          return;
        }

        // Anything else (NotAllowedError and friends): say nothing, keep the page calm.
        shareState.status = "ready";
      });
  }

  shareBtn.addEventListener("click", function (event) {
    event.stopPropagation();
    event.preventDefault();
    shareDog(currentUrl);
  });

  var lastHeartToggle = 0;

  saveBtn.addEventListener("click", function (event) {
    // The frame behind the heart advances the dog; this must never reach it.
    event.stopPropagation();
    event.preventDefault();

    // A double tap on the heart is one decision, not two: ignore the second click.
    var now = Date.now();
    if (now - lastHeartToggle < 450) return;
    lastHeartToggle = now;

    toggleLove(currentUrl);
  });

  saveBtn.addEventListener("dblclick", function (event) {
    event.stopPropagation();
    event.preventDefault();
  });


  fetchBtn.addEventListener("click", fetchDog);
  retryBtn.addEventListener("click", fetchDog);

  /* Clicking the photo fetches another; Space/Enter/Right-arrow work from the page. */
  /* One tap opens the photo full screen; two quick taps save the dog with a small heart
     burst at the exact spot you tapped. */
  var lastTapAt = 0;
  var lastTapX = 0;
  var lastTapY = 0;
  var tapTimer = 0;
  var lastLoveAt = 0;

  frame.addEventListener("click", function (event) {
    if (event.target && event.target.closest && event.target.closest("button")) return;
    if (event.target && event.target.classList && event.target.classList.contains("heart-burst")) return;

    var now = Date.now();
    var isDouble = now - lastTapAt < 300 &&
                   Math.abs(event.clientX - lastTapX) < 48 &&
                   Math.abs(event.clientY - lastTapY) < 48;

    lastTapAt = now;
    lastTapX = event.clientX;
    lastTapY = event.clientY;

    if (isDouble) {
      lastTapAt = 0;
      lastLoveAt = now;
      window.clearTimeout(tapTimer);
      toggleLove(currentUrl);
      if (isLoved(currentUrl)) {
        burstHearts(event.clientX, event.clientY);
        pulseHeartButton();
      }
      return;
    }

    window.clearTimeout(tapTimer);
    if (Date.now() - lastLoveAt < 500) return;
    tapTimer = window.setTimeout(openLightbox, 380);
  });

  function setLovedOpen(open, remember) {
    lovedPanel.hidden = !open;
    lovedToggle.setAttribute("aria-expanded", open ? "true" : "false");
    if (remember === undefined || remember) {
      try {
        window.localStorage.setItem(LOVED_OPEN_KEY, open ? "1" : "0");
      } catch (error) {
        /* the panel simply reopens collapsed next time */
      }
    }
  }

  function readLovedOpen() {
    try {
      return window.localStorage.getItem(LOVED_OPEN_KEY) === "1";
    } catch (error) {
      return false;
    }
  }

  lovedToggle.addEventListener("click", function () {
    var open = lovedPanel.hidden;
    setLovedOpen(open);
    if (open) setStatus("");
  });

  document.addEventListener("keydown", function (event) {
    var tag = (event.target && event.target.tagName) || "";
    if (tag === "BUTTON" || tag === "A" || tag === "INPUT") return;
    if (event.key === " " || event.key === "Enter" || event.key === "ArrowRight") {
      event.preventDefault();
      fetchDog();
    }
  });

  paintRecent();
  renderLoved();
  renderCounter();
  syncNameBadge(currentUrl);
  setLovedOpen(readLovedOpen(), false);

  /* A valid shared link shows that exact dog: no fetch, no new animal, same name and breed. */
  sharedView = getSharedDog();
  if (sharedView) {
    paint(sharedView.dog, { countSeen: false });
  } else {
    fetchDog();
  }
})();
</script>

</body>
</html>
